# ─────────────────────────────────────────────────────────────────────────────
# DeepWatch v1.0 — Streamlit Secrets Template
# Save this file as:  .streamlit/secrets.toml
# (create the .streamlit/ folder next to app.py if it doesn't exist)
# ─────────────────────────────────────────────────────────────────────────────

# ── EMAIL (SMTP) ──────────────────────────────────────────────────────────────
# Gmail example — use an App Password, NOT your real Gmail password.
# How to get one: Google Account → Security → 2-Step Verification → App Passwords
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "587"
SMTP_USER = "rajaroybca6@gmail.com"      # sender address
SMTP_PASS = "ozzmwvtreonjxxqm"       # 16-char Gmail App Password
SMTP_TO   = "rajaroy3105@gmail.com"     # recipient (can be same as SMTP_USER)

# ── TURN / ICE (WebRTC NAT traversal) ─────────────────────────────────────────
# Optional — only needed if camera feed fails behind strict firewalls/NAT.
# Free tier: https://dashboard.metered.ca  (sign up → Realtime → TURN credentials)
TURN_URL_1    = "turn:your-turn-server.metered.ca:80"
TURN_URL_2    = "turn:your-turn-server.metered.ca:443"
TURN_URL_3    = "turns:your-turn-server.metered.ca:443"
TURN_URL_4    = ""                       # leave blank if not needed
TURN_USERNAME = "your_turn_username"
TURN_PASSWORD = "your_turn_password"

# Set to "true" to force all traffic through TURN (relay only).
# Useful if peer-to-peer connections are blocked.
FORCE_TURN = "false"